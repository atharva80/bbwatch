name: keeper

# Backstop for watch.yml, three triggers deep:
#   - every 5 min (GitHub's cron is unreliable here, so it is not the only one)
#   - every time a watch run completes, whatever its conclusion
#   - by hand, which is also where test pushes are sent from (a test through
#     watch.yml would queue behind the running watcher for hours)
# It cancels a watch run that has stopped syncing state (hung), then makes
# sure some watch run is running or queued.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: [bbwatch]
    types: [completed]
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pages: write       # deploy the dashboard
  id-token: write    # deploy-pages needs the OIDC token

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Test push
        if: ${{ inputs.test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python3 watch.py --test

      - name: Watchdog
        # A healthy watcher syncs status.json at least every ~10 min. This is
        # the independent half of the check: even if a wedged run fools
        # ensure-watcher.sh, a state file that has not moved for 30 min means
        # nothing is watching, whatever the run list claims.
        run: |
          updated=$(gh api "repos/$GH_REPO/contents/status.json?ref=state" --jq .content 2>/dev/null \
            | base64 -d | jq -r .updated) || { echo "no status yet"; exit 0; }
          age=$(( $(date +%s) - $(date -d "$updated" +%s) ))
          echo "state last synced ${age}s ago ($updated)"
          [ "$age" -gt 1800 ] || exit 0
          echo "state is stale by ${age}s: no watcher is actually working"
          for id in $(gh run list --workflow watch.yml --status in_progress --json databaseId,startedAt \
              --jq '.[] | select((now - (.startedAt | fromdateiso8601)) > 1800) | .databaseId'); do
            echo "watch run $id has not synced for ${age}s: cancelling it (its queued successor takes over)"
            gh run cancel "$id" || true
          done

      - name: Ensure a watcher is running or queued
        run: bash .github/ensure-watcher.sh

      # The dashboard renders the two files the watcher already publishes
      # (status.json, changes.json) into one self-contained page. It rides the
      # keeper rather than a cron of its own: the keeper is the job that fires
      # every few minutes whatever happens to the watcher, so the page's
      # freshness follows the state's freshness without another schedule to
      # keep alive.
      - name: Fetch the latest published state
        run: |
          mkdir -p .state dist
          for f in status.json changes.json; do
            if gh api "repos/$GH_REPO/contents/$f?ref=state" --jq .content 2>/dev/null \
                 | base64 -d > ".state/$f.tmp" && jq -e . ".state/$f.tmp" >/dev/null 2>&1; then
              mv ".state/$f.tmp" ".state/$f"
            else
              rm -f ".state/$f.tmp"
              echo "no usable $f yet"
            fi
          done

      - name: Build the dashboard
        run: python3 dashboard.py --state-dir .state --out dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
