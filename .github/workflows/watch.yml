name: bbwatch

# Near-real-time public bug-bounty watcher, running in GitHub's cloud.
#
# Each run watches for ~5h40m. Its FIRST step queues its successor, which the
# concurrency group holds back until this run ends — whichever way it ends
# (finished, crashed, timed out, cancelled) — so there is always a next run
# and the handover gap is the ~30s runner start-up. keeper.yml is the backstop
# (cron, on every watch completion, hung-run watchdog). Nothing depends on
# GitHub's cron firing on time.
#
# The snapshot lives on the orphan branch `state` (one force-pushed commit),
# restored at start and synced whenever a push goes out (else every 10 min).
#
# Stop everything: `gh workflow disable keeper.yml && gh workflow disable watch.yml`,
# then cancel the running/queued watch runs.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run watches before handing over"
        default: "340"

permissions:
  contents: write   # push the state branch
  actions: write    # queue the successor, keep keeper.yml enabled

concurrency:
  group: bbwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Queue successor
        run: bash .github/ensure-watcher.sh "$GITHUB_RUN_ID"

      - name: Keep the keeper's schedule alive
        # GitHub disables cron workflows after 60 days without repo activity;
        # re-enabling through the API resets that without commits on main.
        run: gh workflow enable keeper.yml || true

      - name: Restore state
        run: |
          mkdir -p .state
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json.gz > .state/state.json.gz
            echo "restored state from $(git log -1 --format=%s FETCH_HEAD)"
          else
            echo "no state branch yet: this run records the baseline"
          fi

      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          STATE_SYNC_CMD: bash .github/sync-state.sh
        run: python3 watch.py --loop --for "${{ inputs.minutes || '340' }}m"

      - name: Save state
        if: always()
        run: bash .github/sync-state.sh

      - name: Make sure a successor is still queued
        if: always()
        run: bash .github/ensure-watcher.sh "$GITHUB_RUN_ID"
